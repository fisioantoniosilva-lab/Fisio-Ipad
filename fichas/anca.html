<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Relatório · Anca</title>
<style>
:root{
  --ink:#13293d; --ink2:#35495a; --ink3:#4a5d6b; --muted:#5f6f7b;
  --navy:#0f2a3d; --teal:#009b94; --teal-dark:#00706b; --teal-tint:#d6efed; --teal-text:#035e59;
  --violet:#6250d6; --orange:#eb6834; --ref:#b3c0c7;
  --panel:#f1f6f7; --line:#d5dee2; --line2:#e6ecef; --grid:#e3e9ec; --mint:#9fe1cb;
  --good:#0ca30c; --warn:#fab219; --crit:#d03b3b;
  --good-bg:#e2f3e2; --good-tx:#155f15; --warn-bg:#fdf0d0; --warn-tx:#7a4d00; --crit-bg:#fbe4e4; --crit-tx:#9b2424;
  --font:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --font-display:-apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);color:var(--ink);background:#e7edef;font-size:13px;line-height:1.35}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:flex;height:100vh}

/* Editor */
.editor{width:480px;flex:none;overflow-y:auto;background:#fff;border-right:1px solid var(--line);padding:16px 18px 60px}
.editor h1{font-family:var(--font-display);font-size:18px;font-weight:600;margin:0 0 2px;color:var(--navy)}
.editor .sub{font-size:12px;color:var(--muted);margin:0 0 12px}
.privacy{display:flex;gap:8px;align-items:flex-start;background:var(--teal-tint);color:var(--teal-text);border-radius:8px;padding:8px 10px;font-size:12px;margin-bottom:12px}
.btnrow{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.btn{border:1px solid var(--line);background:#fff;border-radius:7px;padding:6px 10px;font-size:12.5px;cursor:pointer}
.btn:hover{background:var(--panel)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.primary:hover{background:#1b3e57}
.btn.small{padding:3px 8px;font-size:12px}
.btn.danger{color:var(--crit-tx)}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--teal);outline-offset:1px}
details.sec{border-top:1px solid var(--line2);padding:8px 0}
details.sec>summary{cursor:pointer;font-weight:600;color:var(--navy);font-size:13.5px;list-style:none;display:flex;justify-content:space-between;align-items:center;padding:2px 0}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::after{content:"+";color:var(--muted);font-weight:400}
details.sec[open]>summary::after{content:"−"}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 10px;margin-top:8px}
.fields.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.f{display:flex;flex-direction:column;gap:3px;min-width:0}
.f.full{grid-column:1/-1}
.f label,.lbl{font-size:12px;color:var(--muted)}
.f input,.f select,.f textarea,.tbl input,.card-ed input,.card-ed select,.card-ed textarea{border:1px solid var(--line);border-radius:6px;padding:5px 7px;background:#fff;width:100%;min-width:0}
.f textarea,.card-ed textarea{resize:vertical;min-height:64px;line-height:1.4}
.hint{font-size:12px;color:var(--muted);margin:6px 0 0}
.warnbox{font-size:12px;color:var(--warn-tx);background:var(--warn-bg);border-radius:6px;padding:6px 8px;margin-top:6px}
.tabs{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:3px 10px;font-size:12px;cursor:pointer}
.tab.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.tbl{width:100%;border-collapse:collapse;margin-top:8px;font-size:12px}
.tbl th{font-weight:500;color:var(--muted);text-align:left;padding:3px 2px;border-bottom:1px solid var(--line)}
.tbl td{padding:3px 2px;border-bottom:1px solid var(--line2);vertical-align:middle}
.tbl td.g{font-weight:500;white-space:nowrap;padding-right:6px}
.tbl input{padding:3px 4px;text-align:right;font-variant-numeric:tabular-nums}
.tbl .calc{color:var(--ink3);font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.tbl .calc.bad{color:var(--crit-tx);font-weight:600}
.card-ed{border:1px solid var(--line);border-radius:8px;padding:8px;margin-top:8px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 8px}
.card-ed .full{grid-column:1/-1}
.card-ed .head{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:600;color:var(--navy)}
.mapwrap{display:flex;gap:14px;align-items:flex-start;margin-top:8px}
.mapwrap svg [data-zone]{cursor:pointer}
.mapwrap svg [data-zone]:hover{opacity:.8}
.legend-ed{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--ink3)}
.sw{display:inline-block;width:11px;height:11px;border-radius:2px;vertical-align:-1px;margin-right:5px}

/* Preview */
.preview{flex:1;overflow:auto;padding:16px 24px 40px;min-width:0}
.toolbar{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin:0 auto 14px;padding:8px 12px;background:rgba(231,237,239,.94);border-radius:10px}
.toolbar .status{font-size:12px;color:var(--muted)}
.toolbar .status.bad{color:var(--crit-tx);font-weight:600}
.pages{display:flex;flex-direction:column;align-items:center;gap:24px}
.page{width:794px;height:1123px;flex:none;background:#fff;box-shadow:0 1px 4px rgba(15,42,61,.18);position:relative;overflow:hidden;display:flex;flex-direction:column;gap:10px;color:var(--ink);font-size:13px;line-height:1.35}
.page.compact{gap:6px;line-height:1.28}
.page.compact .kpi{padding:7px 12px;gap:2px}
.page.compact .note{padding:8px 14px;gap:4px}
.page.compact .note p{line-height:1.3}
.page.compact .prow{min-height:30px;padding:1px 0}
.page.compact .orow{padding:2px 0}
.page.compact .ex{padding:5px 10px 5px 5px}

/* Report atoms */
.r-head{background:var(--navy);padding:0 40px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex:none}
.r-h1{margin:0;font-family:var(--font-display);font-weight:600;color:#fff;letter-spacing:-.01em}
.r-light{font-size:12px;color:#b9d0d9}
.chip-mint{font-size:12px;font-weight:600;color:var(--navy);background:var(--mint);padding:3px 10px;border-radius:999px;white-space:nowrap}
.r-sec{margin:0 40px}
.r-h2{margin:0;font-family:var(--font-display);font-size:15px;font-weight:600;color:var(--navy)}
.r-small{font-size:12px;color:var(--ink3)}
.r-muted{font-size:12px;color:var(--muted)}
.kpi{background:var(--panel);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .v{font-family:var(--font-display);font-size:24px;font-weight:600;line-height:1;white-space:nowrap}
.kpi .u{font-size:13px;font-weight:500;color:var(--ink3)}
.pill{align-self:flex-start;display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.pill.teal{color:var(--teal-text);background:var(--teal-tint)}
.pill.gray{color:var(--ink2);background:var(--grid)}
.pill.good{color:var(--good-tx);background:var(--good-bg)}
.pill.warn{color:var(--warn-tx);background:var(--warn-bg)}
.pill.crit{color:var(--crit-tx);background:var(--crit-bg)}
.srow{display:grid;grid-template-columns:144px 264px 64px 100px minmax(0,1fr);column-gap:12px;align-items:center}
.srow.data{height:30px;border-bottom:1px solid var(--line2)}
.srow.data>span:first-child{font-size:12.5px;white-space:nowrap}
.srow.head{font-size:12px;color:var(--muted);padding-bottom:2px;border-bottom:1px solid var(--line);align-items:end}
.num{text-align:right;font-variant-numeric:tabular-nums}
.leg{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--ink3)}
.empty{font-size:12px;color:var(--muted);font-style:italic;padding:10px 0}
.note{background:var(--panel);border-radius:10px;padding:12px 16px;display:flex;flex-direction:column;gap:6px;flex:none}
.note-t{font-size:12px;font-weight:600;color:var(--teal-dark);letter-spacing:.04em}
.note p{margin:0;font-size:12px;line-height:1.38;color:var(--ink2)}
.foot{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:5px}
.prow{display:grid;grid-template-columns:118px minmax(0,1fr) 150px;column-gap:12px;align-items:center;min-height:32px;border-bottom:1px solid var(--line2);padding:2px 0;line-height:1.25}
.orow{display:grid;grid-template-columns:200px 130px 52px 92px 54px minmax(0,1fr);column-gap:8px;align-items:center;font-size:12px;border-bottom:1px solid var(--line2);padding:3px 0;line-height:1.28}
.orow.head{color:var(--muted);border-bottom:1px solid var(--line);padding:0 0 3px}
.box{display:inline-block;width:11px;height:11px;border:1.3px solid var(--ink2);border-radius:2px;vertical-align:-1px;margin-right:3px}
.ex{display:grid;grid-template-columns:48px minmax(0,1fr);gap:10px;align-items:start;background:var(--panel);border-radius:10px;padding:7px 10px 7px 7px;min-width:0;line-height:1.3}
.ex .ph{width:48px;height:48px;border:1.5px dashed #9fb2bc;border-radius:8px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--muted);overflow:hidden}
.ex .ph img{width:100%;height:100%;object-fit:cover;display:block}
.dchip{background:#fff;border:1px solid var(--line);border-radius:6px;padding:0 6px;font-size:12px}
.wrap{white-space:pre-line}

/* Tornozelo e ombro */
.subt{font-size:12.5px;font-weight:600;color:var(--navy);margin:12px 0 0;padding-top:6px;border-top:1px dashed var(--line2)}
.calcline{font-size:12px;color:var(--teal-text);background:var(--teal-tint);border-radius:6px;padding:5px 8px;margin-top:6px}
.idrow{padding-bottom:7px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}
.idrow>div{display:flex;flex-direction:column;gap:1px;min-width:0}
.kpi .v{font-size:21px}
.dline{display:flex;justify-content:space-between;align-items:baseline;gap:6px;font-size:12px;color:var(--ink3)}
.dline b{font-family:var(--font-display);font-size:18px;color:var(--ink);white-space:nowrap}
.col{display:flex;flex-direction:column;gap:4px;min-width:0}
.frow{display:grid;grid-template-columns:104px 140px 36px minmax(0,1fr);column-gap:5px;align-items:center;min-height:24px;border-bottom:1px solid var(--line2);font-size:12px}
.frow.head,.trow.head{color:var(--muted);border-bottom:1px solid var(--line);min-height:0;padding-bottom:2px;align-items:end}
.trow{display:grid;grid-template-columns:132px 44px 44px 66px minmax(0,1fr);column-gap:4px;align-items:center;min-height:20px;line-height:1.2;border-bottom:1px solid var(--line2);font-size:12px}
.qtit{font-size:12px;font-weight:600;color:var(--teal-dark);margin-top:3px}
.qsub{font-size:12px;font-weight:600;color:var(--ink2);margin-top:2px}
.qrow{display:grid;grid-template-columns:70px 44px minmax(0,1fr);white-space:nowrap;column-gap:6px;align-items:center;font-size:12px;min-height:17px;line-height:1.2}
.paass{display:flex;flex-direction:column;border-bottom:1px solid var(--line2);padding:1px 0;font-size:12px;line-height:1.2}
.paass .ph{display:flex;justify-content:space-between;align-items:center;gap:6px}
.sw2{display:inline-block;width:10px;height:7px;border-radius:0 3px 3px 0;margin-right:3px;vertical-align:0}
.dline .was{font-size:13px;font-weight:500;color:var(--muted)}
.idrow>div>span:last-child{white-space:nowrap}
.kpi{padding:8px 11px;gap:3px}
.r-sec{margin:0 32px}
.r-head{padding:0 32px}
.trow>span:nth-child(4){padding-left:8px}
.rtag{font-size:12px;font-weight:600;color:var(--teal-text);margin-right:6px}
.page.compact .frow{min-height:22px}
.page.compact{gap:5px}
.page.compact .prow{min-height:28px}
.page.compact .note{padding:7px 12px}
.page.compact .trow{min-height:18px}
.page.compact .qrow{min-height:16px}
.page.compact .ex .ph{width:44px;height:44px}
.page.compact .ex{grid-template-columns:44px minmax(0,1fr)}
.page.compact .kpi .v{font-size:20px}
.pgic{display:flex;flex-direction:column;font-size:12px;line-height:1.25;margin-top:6px;white-space:normal}
.pgic .qtit{margin-top:0}


/* Modo sessão, textos e modo utente */
.ov{position:fixed;inset:0;z-index:40;background:#f4f7f8;display:flex;flex-direction:column;font-size:14px}
.ov-h{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 18px;background:#fff;border-bottom:1px solid var(--line);flex:none;flex-wrap:wrap}
.ov-acts{display:flex;gap:8px;flex-wrap:wrap}
.ov-b{overflow:auto;padding:14px 18px 60px;flex:1}
.ov input,.ov select,.ov textarea{border:1px solid var(--line);border-radius:8px;padding:8px 9px;background:#fff;font-size:15px;min-width:0;width:100%}
.ov .fields{grid-template-columns:repeat(4,minmax(0,1fr))}
.ov .f label{font-size:12.5px}
.sc-sec{margin:18px 0 8px;font-size:15px;color:var(--navy)}
.sc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.sc{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.sc.wide{grid-column:1/-1}
.sc.nr{background:#f1f3f4;opacity:.85}
.sc-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sc-t{font-weight:600;color:var(--navy);font-size:14.5px}
.sc-h .sc-nr{width:auto;font-size:13px;padding:5px 6px}
.sc-c{font-size:13px;color:var(--teal-text);min-height:16px}
.ed2{display:flex;flex-direction:column;gap:4px}
.ed2 label{font-size:12.5px;color:var(--muted)}
.ed2-in{display:flex;align-items:center;gap:6px}
.ed2-in span{font-weight:600;color:var(--ink2);min-width:14px;font-size:13px}
.ed2-in input{font-size:18px;padding:9px 8px;text-align:center;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chipck{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:5px 10px;font-size:13px;cursor:pointer;background:#fff}
.chipck input{width:auto}
.chipck.on{background:var(--teal-tint);border-color:var(--teal);color:var(--teal-text)}
.chipck.q.on{background:#e6e3fa;border-color:#6250d6;color:#3c3489}
#sc-verif ul{margin:6px 0 6px 18px;padding:0}
.tx-ok{color:var(--good-tx);font-weight:600;font-size:13px}
.tx-bad{color:var(--crit-tx);font-weight:600;font-size:13px}
.ut{background:#fff;z-index:60}
.ut-top{display:flex;align-items:center;gap:14px;padding:14px 22px;flex:none}
.ut-prog{flex:1;height:8px;background:var(--grid);border-radius:4px;overflow:hidden}
.ut-prog div{height:100%;background:var(--teal)}
.ut-sair{border:0;background:none;color:var(--muted);font-size:13px;cursor:pointer;text-decoration:underline}
.ut-b{flex:1;overflow:auto;max-width:760px;width:100%;margin:0 auto;padding:10px 22px 40px;font-size:18px}
.ut-b h2{font-size:24px;line-height:1.3;color:var(--ink);margin:6px 0 18px}
.ut-q{color:var(--muted);font-size:15px;margin:0}
.ut-sec{color:var(--teal-dark);font-weight:600;font-size:16px;margin:8px 0 0}
.ut-ops{display:flex;flex-direction:column;gap:10px}
.ut-op{border:2px solid var(--line);background:#fff;border-radius:12px;padding:16px 18px;font-size:19px;text-align:left;cursor:pointer}
.ut-op.on{border-color:var(--teal);background:var(--teal-tint)}
.ut-esc{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:6px}
.ut-n{border:2px solid var(--line);background:#fff;border-radius:10px;padding:14px 0;font-size:19px;cursor:pointer}
.ut-n.on{border-color:var(--teal);background:var(--teal-tint)}
.ut-anc{display:flex;justify-content:space-between;gap:12px;font-size:15px;color:var(--ink2);margin-top:8px}
.ut-vas input{width:100%;height:36px}
.ut-nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:28px}
.ut-btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:13px 22px;font-size:17px;cursor:pointer}
.ut-btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}
.ut-btn:disabled{opacity:.4;cursor:default}
.ut-lnk{border:0;background:none;color:var(--muted);text-decoration:underline;font-size:15px;cursor:pointer}
.ut-pin{font-size:28px;letter-spacing:.3em;text-align:center;width:180px;border:1px solid var(--line);border-radius:10px;padding:10px}
@media (max-width:820px){.ov .fields{grid-template-columns:repeat(2,minmax(0,1fr))}.ut-esc{grid-template-columns:repeat(6,minmax(0,1fr))}}
@media print{.ov{display:none!important}}
.frow{grid-template-columns:104px 128px 50px minmax(0,1fr)}
.subdet{margin-top:4px}
.subdet summary{font-size:12px;color:var(--ink2);cursor:pointer;padding:2px 0}
.tr-sc{font-weight:600;color:var(--navy);margin:4px 0 10px}
.tr-row{display:grid;grid-template-columns:48px minmax(220px,1fr) minmax(0,2.2fr);gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line2)}
.tr-c{font-weight:600;color:var(--ink2)}
.tr-t{font-size:14px}
.tr-ops{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tr-op{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer;color:var(--ink)}
.tr-op.on{background:#009b94;border-color:#009b94;color:#fff;font-weight:600}


/* Força a toda a largura (região única) */
.flrow{display:grid;grid-template-columns:160px minmax(0,1fr) 70px 96px 92px;column-gap:8px;align-items:center;min-height:30px;border-bottom:1px solid var(--line2);font-size:12.5px}
.flrow.head{color:var(--muted);border-bottom:1px solid var(--line);min-height:0;padding-bottom:3px;font-size:12px;align-items:end}
.page.compact .flrow{min-height:27px}

.imp-bg{position:fixed;inset:0;background:rgba(15,42,61,.5);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}
.imp{background:#fff;border-radius:12px;width:min(1240px,100%);height:min(92vh,920px);display:grid;grid-template-rows:auto minmax(0,1fr) auto;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.imp-h{padding:12px 18px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.imp-h select,.sg select,.sg input:not([type=checkbox]),.sg textarea{border:1px solid var(--line);border-radius:6px;padding:4px 6px;background:#fff;min-width:0;width:100%}
.imp-h select{width:auto}
.imp-b{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);min-height:0}
.imp-l,.imp-r{overflow:auto;padding:10px 18px 18px;min-width:0}
.imp-r{background:#fafcfc;border-left:1px solid var(--line);font-size:12.5px;line-height:1.45}
.imp-f{padding:10px 18px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;align-items:center}
.imp-g{margin:10px 0 2px;font-size:13px;color:var(--navy)}
.sg{display:grid;grid-template-columns:18px 170px minmax(0,1fr);gap:3px 8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line2)}
.sg .sg-l{font-weight:500;font-size:12.5px}
.sg textarea{grid-column:2/-1;resize:vertical;line-height:1.4}
.sg .src{grid-column:2/-1;font-size:11.5px;color:var(--muted);overflow-wrap:anywhere}
.sg .av{grid-column:2/-1;font-size:11.5px;color:var(--warn-tx)}
.imp-r p{margin:0 0 6px;padding:1px 4px}
.imp-r h4{margin:12px 0 4px;font-size:13px;color:var(--navy)}
.imp-r table{border-collapse:collapse;margin:6px 0 10px;font-size:12px}
.imp-r td{border:1px solid var(--line);padding:2px 5px;vertical-align:top}
.imp-r .usada{background:#e1f3f1;border-radius:4px}
.imp-r mark{background:#fdf0d0;color:inherit;padding:0 1px;border-radius:2px}

@media print{
  .imp-bg{display:none!important}
  @page{size:A4;margin:0}
  html,body{height:auto;background:#fff}
  .editor,.toolbar{display:none!important}
  .app{display:block;height:auto}
  .preview{padding:0;overflow:visible}
  .pages{gap:0;zoom:1!important}
  .page{box-shadow:none;width:210mm;height:297mm;break-after:page;page-break-after:always}
  .page:last-child{break-after:auto;page-break-after:auto}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

function metricas(){

  for(const r of regAtivas()){
    for(const g of GRV(r)){
      const n = FG[g].nome.toLowerCase();
      add('lsi:' + g, `${semLado(r) ? 'Rácio E/D' : 'LSI'} · ${n}`, '%', 'up', 0, a => lsiF(a, g));
      add('f:' + g, `Força · ${n} (${semLado(r) ? 'E' : 'lado envolvido'})`, ' kgf', 'up', 1, a => { const x = gf(a, g)[inv(r)]; return x ? x.max : null; }, null, (r === 'jo' || r === 'an') ? num(S.config.mdcJo) : null);
      add('pc:' + g, `Força relativa · ${n}`, '% PC', 'up', 0, a => { const x = gf(a, g)[inv(r)], m = num(a.massa); return x && m ? x.max / m * 100 : null; });
    }
  }
  if(ativo('tz')){
    add('t:wblt', 'WBLT · lado envolvido', ' cm', 'up', 1, a => tv(a, 'wblt', inv('tz')), num(S.config.mdcWblt));
    add('td:wblt', 'WBLT · diferença entre lados', ' cm', 'up', 1, a => difT(a, 'wblt'), num(S.config.mdcWblt));

    add('t:sht', 'Side hop · tempo (lado envolvido)', ' s', 'down', 1, a => tv(a, 'sht', inv('tz')));
    for(const k of ['sht','f8','hop','heel']) add('lsi:' + k, `LSI · ${TT[k].nome.toLowerCase()}`, '%', 'up', 0, a => lsiT(a, k, 'tz'), k === 'hop' ? 8.09 : null);
  }
  if(ativo('tz') || ativo('jo') || ativo('an')){
    add('t:sebt', 'SEBT composto · lado envolvido', '%', 'up', 1, a => tv(a, 'sebt', inv(regMI())), 5);
    add('lsi:sebt', 'LSI · SEBT composto', '%', 'up', 0, a => lsiT(a, 'sebt'));

  if(ativo('om')){
    add('ck', 'CKCUEST · toques', ' toques', 'up', 1, a => ckMean(a), 3);
    add('lsi:uq', 'LSI · UQ-YBT', '%', 'up', 0, a => uqLsi(a));
  }
  if(ativo('an')){
    add('t:rri', 'Rotação interna da anca a 90° · lado envolvido', '°', 'up', 0, a => tv(a, 'rri', inv('an')));
    add('t:rre', 'Rotação externa da anca a 90° · lado envolvido', '°', 'up', 0, a => tv(a, 'rre', inv('an')));
    add('t:sq', 'Squeeze dos adutores a 45°', ' kgf', 'up', 1, a => sqMax(a));
    add('t:cst', 'Levantar e sentar em 30 s', ' rep.', 'up', 0, a => num(a.t && a.t.cst));
    if(!ativo('tz')) add('lsi:hop', 'LSI · salto em distância', '%', 'up', 0, a => lsiT(a, 'hop', 'an'), 8.09);
  }
  for(const k of promsAtivos()) add('p:' + k, PROMS[k].nome.replace(/\s*\([^)]*\)/g, '').replace(/\s*†/g, '').trim(), '', PROMS[k].dir, 0, a => promVal(a, k), PROMS[k].mdc);
  return L;
}
function metrica(id){ return id ? (metricas().find(m => m.id === id) || null) : null; }
function fmtMet(m, v){ return v == null ? '—' : fmt(v, m.dec).replace(/^-/, '−') + m.un; }
function alvoNum(o){ const mm = String(o.alvo || '').replace(/−/g, '-').replace(',', '.').match(/-?\d+(?:\.\d+)?/); return mm ? parseFloat(mm[0]) : null; }
/* Estado de um objetivo ligado a uma métrica: cumprido (atinge o alvo), parcial (melhorou desde a primeira medição, acima do erro de medida quando conhecido), não cumprido */
function estadoObj(o, ai){
  const m = metrica(o.metrica); if(!m) return null;
  const a = S.avaliacoes[ai], v = m.valor(a), alvo = alvoNum(o);
  if(v == null) return {cls:'gray', t:'Sem dados', v:null};
  if(alvo == null) return {cls:'gray', t:'Alvo por definir', v};
  if(m.dir === 'up' ? v >= alvo : v <= alvo) return {cls:'good', t:'Cumprido', v, k:'ok'};
  const i0 = primeiraCom(x => m.valor(x));
  if(i0 < 0 || i0 >= ai) return {cls:'gray', t:'Ponto de partida', v, k:'base'};
  const v0 = m.valor(S.avaliacoes[i0]), d = (v - v0) * (m.dir === 'up' ? 1 : -1);
  const lim = m.mdc != null ? m.mdc : (m.mdcRel != null ? Math.abs(v0) * m.mdcRel / 100 : 0);
  if(d > 0 && d >= lim) return {cls:'warn', t:'Parcial', v, k:'parc'};
  return {cls:'crit', t:'Não cumprido', v, k:'nao'};
}

function miniEvol(r){
  const W = 349, H = 60, x0 = 30, x1 = 318, y0 = 6, y1 = 43, yLab = 57;
  let lab, vals;
  if(r === 'tz'){
    const k = S.config.evolTz || 'sht';
    lab = k === 'tz_ev' ? 'força dos eversores' : TT[k].nome.toLowerCase();
    vals = S.avaliacoes.map(a => k === 'tz_ev' ? lsiF(a, 'tz_ev') : lsiT(a, k, 'tz'));
  } else if(r === 'jo'){ const g = S.config.grupoChaveJo || 'kext'; lab = FG[g].curto; vals = S.avaliacoes.map(a => comparavelJo(a) ? lsiF(a, g) : null); }
  else if(r === 'an'){ const g = S.config.grupoChaveAn || 'an_abd'; lab = FG[g].curto; vals = S.avaliacoes.map(a => lsiF(a, g)); }
  else { lab = 'rotação externa a 0°'; vals = S.avaliacoes.map(a => lsiF(a, 'om_re0')); }
  const pts = vals.map((v, i) => ({i, v})).filter(p => p.v != null);
  if(pts.length < 2) return {lab, svg:''};
  const n = S.avaliacoes.length;
  const X = i => x0 + 12 + i / Math.max(1, n - 1) * (x1 - x0 - 40);
  const all = pts.map(p => p.v);
  const yLo = Math.min(50, Math.floor(Math.min(...all) / 10) * 10), yHi = Math.max(100, Math.ceil(Math.max(...all) / 10) * 10);
  const Y = v => y1 - (v - yLo) / (yHi - yLo) * (y1 - y0);
  const verde = num(S.config.verde) ?? 90, am = num(S.config.amarelo) ?? 80;
  const yv = Y(Math.min(yHi, verde)), ya = Y(Math.max(yLo, am));
  let s = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolução do LSI: ${esc(lab)}">`;
  s += `<rect x="${x0}" y="${y0}" width="${x1-x0}" height="${(yv-y0).toFixed(1)}" fill="#e6f4e6"/><rect x="${x0}" y="${yv.toFixed(1)}" width="${x1-x0}" height="${(ya-yv).toFixed(1)}" fill="#fdf3dd"/><rect x="${x0}" y="${ya.toFixed(1)}" width="${x1-x0}" height="${(y1-ya).toFixed(1)}" fill="#fbecec"/>`;
  for(const t of [yLo, am, yHi]) s += `<text x="${x0-5}" y="${(Y(t)+4).toFixed(1)}" font-size="12" fill="#5f6f7b" text-anchor="end">${fmt(t,0)}</text>`;
  s += `<line x1="${x0}" y1="${y1}" x2="${x1}" y2="${y1}" stroke="#b3c0c7" stroke-width="1"/>`;
  s += `<polyline points="${pts.map(p => X(p.i).toFixed(1) + ',' + Y(p.v).toFixed(1)).join(' ')}" fill="none" stroke="#009b94" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`;

}

let TEXTOS = {};
function parseQ(q){
  const t = TEXTOS[q] || {}, out = [];
  const opDef = String(t.opcoes || '').split('\n').map(x => x.trim()).filter(Boolean);
  for(const raw of String(t.itens || '').split('\n')){
    const l = raw.trim(); if(!l) continue;
    if(l.startsWith('#')){ out.push({h:l.replace(/^#+\s*/, '')}); continue; }
    const [txt, extra] = l.split('|').map(x => x && x.trim());
    out.push({txt, ops: extra ? extra.split(';').map(x => x.trim()).filter(Boolean) : opDef});
  }
  return out;
}
function validarQ(q){
  const it = parseQ(q).filter(x => !x.h), d = QD[q], err = [];
  if(it.length !== d.n) err.push(`${it.length} de ${d.n} itens`);
  if(d.tipo === 'likert'){ const bad = it.filter(x => x.ops.length !== d.nop).length; if(bad) err.push(`${bad} itens sem ${d.nop} opções de resposta`); }
  else { const bad = it.filter(x => x.ops.length !== 2).length; if(bad) err.push(`${bad} itens sem as 2 âncoras (início; fim)`); }
  return err;
}
function cotar(q, r){
  const v = r.map(x => x == null ? null : x);
  const ok = x => x != null;
  if(q === 'faos' || q === 'koos' || q === 'hoos'){
    const sub = {}, out = {};
    /* HOOS LK 2.0 (PT-PT): S1–S5, P1–P10, A1–A17, SP1–SP4, Q1–Q4; mesma regra do KOOS (até 2 itens em falta por subescala) */
    const lim = q === 'hoos' ? [['Sint',[0,5]], ['Dor',[5,15]], ['AVD',[15,32]], ['Desp',[32,36]], ['QV',[36,40]]] : [['Sint',[0,7]], ['Dor',[7,16]], ['AVD',[16,33]], ['Desp',[33,38]], ['QV',[38,42]]];
    for(const [k, ab] of lim) sub[q + k] = ab;
    for(const k in sub){
      const [i0, i1] = sub[k], it = v.slice(i0, i1), n = it.length, resp = it.filter(ok);
      if(n - resp.length > 2 || !resp.length){ out[k] = null; continue; }
      const media = resp.reduce((s, x) => s + x, 0) / resp.length;
      out[k] = 100 - media * 25;
    }
    return out;
  }
  if(q === 'faam'){
    const sc = [4,3,2,1,0];
    const parte = (i0, i1, min) => { const it = v.slice(i0, i1); const resp = it.filter(ok); if(resp.length < min) return null; const val = resp.filter(x => x < 5).map(x => sc[x]); if(!val.length) return null; return val.reduce((s, x) => s + x, 0) / (val.length * 4) * 100; };
    return {faamAvd: parte(0, 21, 20), faamDesp: parte(21, 29, 7)};
  }
  if(q === 'lefs'){ return {lefs: v.every(ok) ? v.reduce((s, x) => s + x, 0) : null}; }
  if(q === 'dash'){ const resp = v.filter(ok).map(x => x + 1); return {dash: resp.length >= 27 ? (resp.reduce((s, x) => s + x, 0) / resp.length - 1) * 25 : null}; }
  if(q === 'wosi'){ return {wosi: v.every(ok) ? v.reduce((s, x) => s + x, 0) : null}; }
  /* NAHS PT-PT (Rodrigues et al. 2017): 0–4 por item (impresso de 4 = nenhuma a 0 = extrema); soma × 1,25; só com os 20 itens */
  if(q === 'nahs'){ return {nahs: v.every(ok) ? v.reduce((s, x) => s + (4 - x), 0) * 1.25 : null}; }
  /* TSK-13 PT-PT (Cordeiro et al. 2013): 1–4 por item, sem itens invertidos; só com os 13 itens (decisão de 31/10/2026) */
  if(q === 'tsk'){ return {tsk: v.every(ok) ? v.reduce((s, x) => s + x + 1, 0) : null}; }
  /* PGIC PT-PT (Domingues & Cruz 2011): uma pergunta, 1–7 pela ordem impressa */
  if(q === 'pgic'){ return {pgic: ok(v[0]) ? v[0] + 1 : null}; }
  if(q === 'alrrsi'){ return {alrrsi: v.every(ok) ? v.reduce((s, x) => s + x, 0) / 120 * 100 : null}; }
  return {};
}

/* ===================== Modo sessão ===================== */
let sessaoAberta = false;
function campoED(base, rotulo, extra='inputmode="decimal"'){
  return `<div class="ed2"><label>${rotulo}</label><div class="ed2-in"><span>E</span>${inp(base + '.E', extra + ' aria-label="' + esc(rotulo) + ' E"')}<span>D</span>${inp(base + '.D', extra + ' aria-label="' + esc(rotulo) + ' D"')}</div></div>`;
}
function calcSessao(id){
  const a = S.avaliacoes[tab];
  const L = v => v != null ? `LSI ${fmt(v,0)}%` : '';
  if(id === 'wblt'){ const d = difT(a, 'wblt'); return d != null ? `diferença ${fmtSigned(d,1)} cm` : ''; }
  if(['sht','f8','hop','heel','sebt'].includes(id)){
    const p = [];
    if(id === 'sebt'){ for(const s of ['E','D']){ const c = tv(a, 'sebt', s); if(c != null) p.push(`${s} ${fmt(c,1)}%`); } if(!(compMI('E') && compMI('D'))) p.push('falta comprimento do membro'); }
    if(id === 'hop') for(const s of ['E','D']){ const m = tv(a, 'hop', s); if(m != null) p.push(`máx. ${s} ${fmt(m,0)} cm`); }
    const l = lsiT(a, id); if(l != null) p.push(L(l));
    return p.join(' · ');
  }
  if(id === 'ck'){ const m = ckMean(a); return m != null ? `média ${fmt(m,1)} toques` : ''; }
  if(id === 'sq'){ const m = sqMax(a); return m != null ? `máx. ${fmt(m,1)} kgf` : ''; }
  if(id === 'rri' || id === 'rre'){ const e = tv(a, id, 'E'), d = tv(a, id, 'D'); return e != null && d != null ? `diferença ${inv('an')}−${non('an')} ${fmtSigned(tv(a, id, inv('an')) - tv(a, id, non('an')),0)}°` : ''; }
  if(id === 'uq'){ const p = []; for(const s of ['E','D']){ const c = uqComp(a, s); if(c != null) p.push(`${s} ${fmt(c,1)}%`); } const l = uqLsi(a); if(l != null) p.push(L(l)); if(!(num(S.meta.om.compE) && num(S.meta.om.compD))) p.push('falta comprimento do membro'); return p.join(' · '); }
  if(TS[id] && TS[id].forca){
    const x = gf(a, id), p = [];
    for(const s of ['E','D']) if(x[s]) p.push(`máx. ${s} ${fmt(x[s].max,1)} kgf${x[s].cv != null && x[s].cv > 10 ? ` (CV ${fmt(x[s].cv,0)}%)` : ''}`);
    const l = lsiF(a, id); if(l != null) p.push(L(l));
    return p.join(' · ');
  }
  return '';
}
function cartaoTeste(id, corpo){
  const a = S.avaliacoes[tab], ap = `avaliacoes.${tab}`;
  const nr = (a.nr || {})[id];
  return `<div class="sc${nr ? ' nr' : ''}" id="sc-${id}"><div class="sc-h"><span class="sc-t">${esc(TS[id].nome)}</span>${sel(`${ap}.nr.${id}`, NR, 'data-struct="1" class="sc-nr"')}</div>${nr ? '' : corpo}<div class="sc-c" id="scc-${id}">${esc(calcSessao(id))}</div></div>`;
}
function corpoTeste(id){
  const ap = `avaliacoes.${tab}`, a = S.avaliacoes[tab];
  if(id === 'nprsJo') return `<div class="ed2"><label>NPRS 0–10 · pior dor na última semana</label><div class="ed2-in">${inp(ap + '.proms.nprsJo', 'inputmode="decimal" aria-label="NPRS do joelho"')}</div></div>`;
  if(id === 'nprsTz') return `<div class="ed2"><label>NPRS 0–10 · no desporto</label><div class="ed2-in">${inp(ap + '.proms.nprsTzD', 'inputmode="decimal" aria-label="NPRS no desporto"')}</div></div><div class="ed2"><label>NPRS 0–10 · nas últimas 24 h</label><div class="ed2-in">${inp(ap + '.proms.nprsTz24', 'inputmode="decimal" aria-label="NPRS nas últimas 24 h"')}</div></div>`;
  if(id === 'nprsAn') return `<div class="ed2"><label>NPRS 0–10 · pior dor na última semana</label><div class="ed2-in">${inp(ap + '.proms.nprsAn', 'inputmode="decimal" aria-label="NPRS da anca"')}</div></div>`;
  if(id === 'rri') return campoED(ap + '.t.rri', 'Rotação interna a 90° de flexão (°)', 'inputmode="numeric"');
  if(id === 'rre') return campoED(ap + '.t.rre', 'Rotação externa a 90° de flexão (°)', 'inputmode="numeric"');
  if(id === 'sq') return `<div class="ed2"><label>Squeeze a 45° · 3 ensaios (kgf)</label><div class="ed2-in">${[0,1,2].map(t => inp(`${ap}.t.sq.${t}`, 'inputmode="decimal" aria-label="Squeeze ' + (t+1) + '"')).join('')}</div></div>`;
  if(id === 'cst') return `<div class="ed2"><label>Repetições em 30 s</label><div class="ed2-in">${inp(ap + '.t.cst', 'inputmode="numeric" aria-label="Levantar e sentar em 30 s"')}</div></div>`;
  if(id === 'nprsOm') return `<div class="ed2"><label>NPRS 0–10 · pior dor na última semana</label><div class="ed2-in">${inp(ap + '.proms.nprsOm', 'inputmode="decimal" aria-label="NPRS do ombro"')}</div></div>`;
  if(id === 'wblt') return campoED(ap + '.t.wblt', 'Distância hálux–parede (cm)') + campoED(ap + '.t.wbltAng', 'Ângulo da tíbia (°), opcional');
  if(id === 'sls') return campoED(ap + '.t.sls', 'Erros em 20 s, olhos fechados', 'inputmode="numeric"');
  if(id === 'sebt') return campoED(ap + '.t.sebt.ant', 'Anterior (cm)') + campoED(ap + '.t.sebt.pm', 'Posteromedial (cm)') + campoED(ap + '.t.sebt.pl', 'Posterolateral (cm)');
  if(id === 'sht') return campoED(ap + '.t.sht', '10 saltos a 30 cm (s)');
  if(id === 'f8') return campoED(ap + '.t.f8', '2 voltas a 5 m (s)');
  if(id === 'heel') return campoED(ap + '.t.heel', 'Repetições, rampa de 10°', 'inputmode="numeric"');
  if(id === 'hop') return `<div class="ed2"><label>3 saltos por perna (cm)</label>${['E','D'].map(s => `<div class="ed2-in"><span>${s}</span>${[0,1,2].map(t => inp(`${ap}.t.hop.${s}.${t}`, 'inputmode="decimal" aria-label="Salto ' + s + ' ' + (t+1) + '"')).join('')}</div>`).join('')}</div>`;
  if(id === 'ck') return `<div class="ed2"><label>Toques em 15 s · 3 ensaios</label><div class="ed2-in">${[0,1,2].map(t => inp(`${ap}.t.ck.${t}`, 'inputmode="decimal" aria-label="CKCUEST ' + (t+1) + '"')).join('')}</div></div>`;
  if(id === 'uq') return campoED(ap + '.t.uq.med', 'Medial (cm)') + campoED(ap + '.t.uq.il', 'Inferolateral (cm)') + campoED(ap + '.t.uq.sl', 'Superolateral (cm)');
  if(TS[id] && TS[id].forca){
    const nt = nT(FG[id].reg);
    return `<div class="ed2"><label>Tentativas (kgf)</label>${['E','D'].map(s => `<div class="ed2-in"><span>${s}</span>${Array.from({length:nt}, (_, t) => inp(`${ap}.forca.${id}.${s}.${t}`, 'inputmode="decimal" aria-label="' + esc(FG[id].nome + ' ' + s + ' ' + (t+1)) + '"')).join('')}</div>`).join('')}</div>`;
  }
  return '';
}
function renderSessao(){
  let el = document.getElementById('sessao');
  if(!sessaoAberta){ if(el) el.remove(); return; }
  if(!el){ el = document.createElement('div'); el.id = 'sessao'; el.className = 'ov'; document.body.appendChild(el); }
  const a = S.avaliacoes[tab], b = batDe(a), ap = `avaliacoes.${tab}`;
  const yOld = el.querySelector('.ov-b') ? el.querySelector('.ov-b').scrollTop : 0;
  let h = `<div class="ov-h"><div><b>Modo sessão</b> · ${tab === 0 ? 'Avaliação inicial' : 'Reavaliação ' + tab}${a.data ? ' · ' + dataPT(a.data) : ''}</div><div class="ov-acts"><button class="btn" type="button" data-sa="utente">Questionários do utente</button><button class="btn primary" type="button" data-sa="fechar">Ver relatório</button></div></div><div class="ov-b">`;
  h += `<div class="sc-grid"><div class="sc wide"><div class="sc-h"><span class="sc-t">Bateria desta avaliação</span></div><div class="fields">`;
  h += fld('Data', inp(ap + '.data', 'type="date"')) + fld('Massa (kg)', inp(ap + '.massa', 'inputmode="decimal"'));
  if(ativo('jo')) h += fld('Joelho', sel(ap + '.bat.jo', Object.entries(BAT).filter(([, p]) => p.reg === 'jo').map(([k, p]) => [k, p.nome]), 'data-bat="1"'));
  if(ativo('tz')) h += fld('Tornozelo', sel(ap + '.bat.tz', Object.entries(BAT).filter(([, p]) => p.reg === 'tz').map(([k, p]) => [k, p.nome]), 'data-bat="1"'));
  if(ativo('an')) h += fld('Anca', sel(ap + '.bat.an', Object.entries(BAT).filter(([, p]) => p.reg === 'an').map(([k, p]) => [k, p.nome]), 'data-bat="1"'));
  if(ativo('om')) h += fld('Ombro', sel(ap + '.bat.om', Object.entries(BAT).filter(([, p]) => p.reg === 'om').map(([k, p]) => [k, p.nome]), 'data-bat="1"'));
  h += `</div><div class="chips">`;
  for(const id in TS) if(regOk(TS[id]) && (!TS[id].forca || GRV(FG[id].reg).includes(id))) h += `<label class="chipck${b.t[id] ? ' on' : ''}"><input type="checkbox" data-bt="${id}"${b.t[id] ? ' checked' : ''}>${esc(TS[id].nome)}</label>`;
  for(const q in QD) if(qDisp(q, a)) h += `<label class="chipck q${b.q[q] ? ' on' : ''}"><input type="checkbox" data-bq="${q}"${b.q[q] ? ' checked' : ''}>${QD[q].nome}</label>`;
  h += `</div></div></div>`;
  for(const [sk, st] of SEC){
    const ids = Object.keys(TS).filter(id => TS[id].sec === sk && testeAtivo(a, id));
    const qs = sk === 'inicio' ? Object.keys(QD).filter(q => questAtivo(a, q)) : [];
    if(!ids.length && !qs.length) continue;
    h += `<h3 class="sc-sec">${st}</h3><div class="sc-grid">`;
    if(qs.length){
      const est = qs.map(q => { const k = {koos:'koosDor', lefs:'lefs', faos:'faosDor', faam:'faamAvd', alrrsi:'alrrsi', wosi:'wosi', dash:'dash', tsk:'tsk', pgic:'pgic', hoos:'hoosDor', nahs:'nahs'}[q]; return `${QD[q].nome}: ${promVal(a, k) != null ? 'preenchido' : 'por preencher'}`; }).join(' · ');
      h += `<div class="sc"><div class="sc-h"><span class="sc-t">Questionários</span></div><div class="sc-c" style="color:var(--ink2)">${esc(est)}</div><div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px"><button class="btn" type="button" data-sa="utente">Entregar ao utente</button>${qs.filter(q => !validarQ(q).length).map(q => `<button class="btn" type="button" data-papel="${q}">${esc(QD[q].nome)} em papel</button>`).join('')}</div></div>`;
    }
    for(const id of ids) h += cartaoTeste(id, corpoTeste(id));
    h += `</div>`;
  }
  if(ativo('tz') && b.tz === 'tz_rts'){
    h += `<h3 class="sc-sec">6 · Regresso ao desporto</h3><div class="sc-grid"><div class="sc wide"><div class="fields" style="grid-template-columns:repeat(4,minmax(0,1fr))">`;
    for(const k of ['sls','sebt','sht','f8']) h += fld(`Falha · ${TT[k].nome.replace(' composto','')}`, sel(`${ap}.t.falha.${k}`, [['',''],['nao','Não'],['sim','Sim']]));
    h += `</div><div class="fields" style="grid-template-columns:repeat(3,minmax(0,1fr))">`;
    for(const d of PAASS) h += fld(d.nome, sel(`${ap}.paass.${d.k}`, [['','Por avaliar'],['ok','Cumprido'],['parc','Parcial'],['nao','Não cumprido']]));
    h += fld('Sessão de treino completa', sel(ap + '.treino', [['',''],['sim','Sim'],['nao','Não']]));
    h += `</div></div></div>`;
  }
  const vf = verificacao(tab);
  h += `<h3 class="sc-sec">Verificação</h3><div class="sc wide" id="sc-verif">${verifHtml(vf)}</div>`;
  h += `</div>`;
  el.innerHTML = h;
  el.querySelector('.ov-b').scrollTop = yOld;
}
function verifHtml(vf){ return vf.length ? `<b>Falta${vf.length > 1 ? 'm' : ''} ${vf.length} dado${vf.length > 1 ? 's' : ''} crítico${vf.length > 1 ? 's' : ''}:</b><ul>${vf.map(x => `<li>${esc(x)}</li>`).join('')}</ul><span class="r-muted">Os dados do episódio (lado, datas, comprimentos, posição do joelho) preenchem-se no painel do relatório.</span>` : '<b>Tudo o que esta bateria pede está preenchido.</b>'; }
function atualizarSessao(){
  if(!sessaoAberta) return;
  for(const id in TS){ const c = document.getElementById('scc-' + id); if(c) c.textContent = calcSessao(id); }
  const v = document.getElementById('sc-verif'); if(v) v.innerHTML = verifHtml(verificacao(tab));
}
document.addEventListener('input', ev => {
  const ov = ev.target.closest && ev.target.closest('#sessao'); if(!ov) return;
  const el = ev.target, k = el.dataset && el.dataset.k; if(!k) return;
  setPath(S, k, el.value); atualizarSessao(); atualizarCalc(); agendar();
});
document.addEventListener('change', ev => {
  const ov = ev.target.closest && ev.target.closest('#sessao'); if(!ov) return;
  const el = ev.target, a = S.avaliacoes[tab];
  if(el.dataset.bt){ batDe(a).t[el.dataset.bt] = el.checked; renderSessao(); agendar(); return; }
  if(el.dataset.bq){ batDe(a).q[el.dataset.bq] = el.checked; renderSessao(); agendar(); return; }
  const k = el.dataset && el.dataset.k; if(!k) return;
  setPath(S, k, el.value);
  if(el.dataset.bat){ aplicarBat(a); }
  if(el.dataset.bat || el.dataset.struct || k.endsWith('.data')) renderSessao();
  agendar();
});
document.addEventListener('click', ev => {
  const b = ev.target.closest && ev.target.closest('[data-sa]'); if(!b) return;
  if(b.dataset.sa === 'fechar'){ sessaoAberta = false; renderSessao(); buildEditor(); render(); }
  if(b.dataset.sa === 'utente'){ abrirUtente(); }
});

/* ===================== Textos dos questionários (colados pelo fisioterapeuta) ===================== */
function carregarTextos(){
  const emb = document.getElementById('textos-questionarios');
  if(emb && emb.textContent.trim()){ try{ TEXTOS = JSON.parse(emb.textContent); return; }catch(e){} }
  try{ const v = localStorage.getItem('textos-questionarios'); if(v) TEXTOS = JSON.parse(v); }catch(e){}
}
let textosAberto = false;
function renderTextos(){
  let el = document.getElementById('textos');
  if(!textosAberto){ if(el) el.remove(); return; }
  if(!el){ el = document.createElement('div'); el.id = 'textos'; el.className = 'ov'; document.body.appendChild(el); }
  let h = `<div class="ov-h"><div><b>Textos dos questionários</b> · colar uma vez, a partir das versões licenciadas</div><div class="ov-acts"><button class="btn" type="button" data-tx="guardar">Guardar neste computador</button><button class="btn" type="button" data-tx="modelo">Descarregar modelo com os textos</button><button class="btn" type="button" data-tx="ipad">Exportar textos para o iPad</button><button class="btn primary" type="button" data-tx="fechar">Fechar</button></div></div><div class="ov-b">`;
  h += `<p class="hint" style="max-width:900px">Um item por linha, pela ordem impressa. Uma linha começada por # é um título de secção (não conta como item). Opções de resposta: uma por linha, pela ordem impressa (da primeira à última coluna). Se um item tiver opções próprias, escreva-as na mesma linha depois de |, separadas por ; (por exemplo: <i>texto do item | opção 1; opção 2; …</i>). No WOSI, escreva depois de | as âncoras do início e do fim da escala, separadas por ;.</p>`;
  for(const q in QD){
    if(!qRegOk(q)) continue;
    const d = QD[q], t = TEXTOS[q] || {}, err = validarQ(q);
    const regra = {koos:'5 opções por item (pontuadas 0 a 4 pela ordem impressa). Ordem dos códigos: S1–S7, P1–P9, A1–A17, SP1–SP5, Q1–Q4; confirme com a sua versão.', lefs:'5 opções por item, pela ordem impressa: dificuldade extrema ou incapaz (0) … nenhuma dificuldade (4); 20 itens; confirme com a sua versão.', faos:'5 opções por item (pontuadas 0 a 4 pela ordem impressa). Ordem dos códigos: S1–S7, P1–P9, A1–A17, SP1–SP5, Q1–Q4; confirme com a sua versão.', faam:'6 opções (pela ordem impressa: sem dificuldade … incapaz, e por fim "não se aplica"); 21 itens de AVD seguidos dos 8 de desporto.', alrrsi:'escala de 0 a 10 por item; escreva as âncoras do 0 e do 10.', wosi:'escala visual de 0 a 100 por item (0 = sem problema); escreva as âncoras do 0 e do 100.', dash:'5 opções por item (pontuadas 1 a 5 pela ordem impressa); só os 30 itens principais.', tsk:'4 opções por item, pela ordem impressa: discordo plenamente (1) … concordo plenamente (4); 13 itens; total 13–52, só cotado com todos os itens. Comum a todas as regiões.', pgic:'1 pergunta com 7 opções, pela ordem impressa (1 = sem alterações ou piorou … 7 = muito melhor). Só nas reavaliações; comum a todas as regiões.', hoos:'5 opções por item (pontuadas 0 a 4 pela ordem impressa); 40 itens pela ordem S1–S5, P1–P10, A1–A17, SP1–SP4, Q1–Q4.', nahs:'5 opções por item, pela ordem impressa: nenhuma (4) … extrema (0); 20 itens; total × 1,25 (0–100), só com todos os itens.'}[q];
    h += `<div class="sc wide" style="margin-bottom:12px"><div class="sc-h"><span class="sc-t">${d.nome} · ${d.n} itens</span><span class="${err.length ? 'tx-bad' : 'tx-ok'}">${err.length ? esc(err.join(' · ')) : 'Pronto'}</span></div><p class="hint">${esc(regra)}</p><div class="fields" style="grid-template-columns:2fr 1fr">`;
    h += `<div class="f"><label>Itens</label><textarea data-tq="${q}.itens" rows="8">${esc(t.itens || '')}</textarea></div>`;
    h += `<div class="f"><label>Opções de resposta (uma por linha)</label><textarea data-tq="${q}.opcoes" rows="8">${esc(t.opcoes || '')}</textarea></div>`;
    h += `<div class="f full"><label>Instruções para o utente</label><textarea data-tq="${q}.instr" rows="2">${esc(t.instr || '')}</textarea></div>`;
    const it = parseQ(q).filter(x => !x.h);
    if(it.length) h += `<p class="hint">Primeiros itens: ${it.slice(0, 3).map((x, i) => `${COD[q][i] || '?'} = ${esc((x.txt || '').slice(0, 40))}…`).join(' · ')}</p>`;
    h += `</div></div>`;
  }
  el.innerHTML = h + `</div>`;
}
document.addEventListener('input', ev => {
  const k = ev.target.dataset && ev.target.dataset.tq; if(!k) return;
  const [q, c] = k.split('.'); TEXTOS[q] = TEXTOS[q] || {}; TEXTOS[q][c] = ev.target.value;
});
document.addEventListener('change', ev => { if(ev.target.dataset && ev.target.dataset.tq) renderTextos(); });
document.addEventListener('click', ev => {
  const b = ev.target.closest && ev.target.closest('[data-tx]'); if(!b) return;
  if(b.dataset.tx === 'fechar'){ textosAberto = false; renderTextos(); return; }
  if(b.dataset.tx === 'guardar'){ try{ localStorage.setItem('textos-questionarios', JSON.stringify(TEXTOS)); b.textContent = 'Guardado neste computador'; }catch(e){ b.textContent = 'Não foi possível guardar: use "Descarregar modelo"'; } return; }
  if(b.dataset.tx === 'modelo') descarregarModelo();
  if(b.dataset.tx === 'ipad') exportarTextos();
});
function descarregarFicheiro(nome, texto, tipo){
  const blob = new Blob([texto], {type:tipo || 'application/json'}), url = URL.createObjectURL(blob);
  const el = document.createElement('a'); el.href = url; el.download = nome; document.body.appendChild(el); el.click(); el.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
function exportarTextos(){
  const n = Object.keys(TEXTOS).filter(q => QD[q] && !validarQ(q).length);
  if(!n.length){ alert('Ainda não há questionários completos para exportar. Cole os textos primeiro.'); return; }
  descarregarFicheiro('textos-questionarios-ipad.json', JSON.stringify({formato:'textos-questionarios', versao:1, criado:new Date().toISOString().slice(0, 10), textos:TEXTOS}));
  alert('Ficheiro criado com ' + n.map(q => QD[q].nome).join(', ') + '.\nEnvie-o para o iPad (AirDrop) e importe-o na app dos questionários. Guarde-o num local protegido.');
}
/* ===================== Respostas preenchidas no iPad ===================== */
function importarRespostas(o){
  if(!o || o.formato !== 'respostas-questionarios' || !o.questionarios) throw new Error('formato');
  const cod = String(o.codigo || '').trim();
  if(S.meta.codigo && cod && S.meta.codigo.trim() !== cod && !confirm(`O ficheiro é do utente "${cod}" e este relatório é de "${S.meta.codigo}". Importar mesmo assim?`)) return;
  let ai = o.data ? S.avaliacoes.findIndex(a => a.data === o.data) : -1;
  if(ai < 0){
    ai = tab; const a = S.avaliacoes[ai];
    if(a.data && o.data && a.data !== o.data && !confirm(`Não há nenhuma avaliação com a data ${dataPT(o.data)}. Juntar à avaliação aberta (${dataPT(a.data)})?`)) return;
    if(!a.data && o.data) a.data = o.data;
  }
  if(!S.meta.codigo && cod) S.meta.codigo = cod;
  const a = S.avaliacoes[ai]; a.resp = a.resp || {}; a.proms = a.proms || {};
  const res = [];
  for(const q in o.questionarios){
    if(!QD[q]) continue;
    const r = o.questionarios[q].r;
    if(!Array.isArray(r) || r.length !== QD[q].n){ res.push(`${QD[q].nome}: ficheiro incompleto, não importado`); continue; }
    if(QD[q].reav && ai === 0){ res.push(`${QD[q].nome}: só se aplica em reavaliações; não foi importada para a avaliação inicial`); continue; }
    a.resp[q] = {r, data:o.questionarios[q].data || o.data, origem:'iPad'};
    const sc = cotar(q, r);
    for(const k in sc){ const d = PROM_INT.includes(k) ? 0 : 1; if(sc[k] != null) a.proms[k] = fmt(sc[k], d); res.push(`${PROMS[k] ? PROMS[k].leg.replace(' †', '') : QD[k] ? QD[k].nome : k}: ${sc[k] != null ? fmt(sc[k], d) : 'não cotável (itens em falta)'}`); }

    else if(s.campo === 'prom.nprs'){
      s.campo = 'prom.' + {jo:'nprsJo', tz:'nprsTzD', om:'nprsOm', an:'nprsAn'}[rp];
      if(rp !== 'jo') nota(s, rp === 'tz' ? 'confirmar se é a dor no desporto' : 'confirmar se é a pior dor da última semana');
    }
    else if(s.tipo === 'prom' && !pa.includes(s.campo.slice(5))) nota(s, 'questionário não previsto para este perfil');
  }
  return r;
}
document.getElementById('fileImp').addEventListener('change', async ev => {
  const fs = [...ev.target.files]; if(!fs.length) return;
  const lista = [], falhas = [];
  const stem = n => n.replace(/\.[^.]+$/, '').trim().toLowerCase();
  const docx = new Set(fs.filter(f => /\.docx$/i.test(f.name)).map(f => stem(f.name)));
  const st = document.getElementById('status'); const st0 = st.textContent;
  for(const f of fs){
    const pdf = /\.pdf$/i.test(f.name);
    if(!pdf && !/\.docx$/i.test(f.name)){ falhas.push(f.name + ' (só ficheiros .docx ou .pdf)'); continue; }
    if(pdf && docx.has(stem(f.name))){ falhas.push(f.name + ' (mesma ficha que o Word com o mesmo nome)'); continue; }
    try{ st.textContent = 'A ler ' + f.name + '…'; lista.push({nome: f.name, r: ajustarRegioes(pdf ? await lerPdf(f) : await lerDocx(f))}); }
    catch(e){
      const m = String(e && (e.name || '') + ' ' + (e.message || ''));
      falhas.push(f.name + (/navegador/.test(m) ? ' (este navegador não lê o ficheiro: use o Chrome ou atualize o Safari)' : /sem-texto/.test(m) ? ' (PDF sem texto, provavelmente digitalizado: não é possível ler)' : /Password/i.test(m) ? ' (PDF protegido por palavra-passe)' : ' (não foi possível ler)'));
    }
  }
  st.textContent = st0;
  if(falhas.length) alert('Não importados:\n' + falhas.join('\n'));
  const dataDe = it => (it.r.sug.find(s => s.campo === 'av.data') || {}).valor || '9999';
  lista.sort((x, y) => dataDe(x) < dataDe(y) ? -1 : dataDe(x) > dataDe(y) ? 1 : 0);
  IMPQ = lista; proximoImport();
});
function proximoImport(){ IMPATUAL = IMPQ.shift() || null; renderImport(); }
function textoDoc(r){
  const us = new Set(r.usadas || []), secs = new Set(r.seccoes || []);
  const realca = s => { let out = '', last = 0; const re = /\d{1,4}(?:[.,]\d{1,2})?(?:\s*(?:kgf|kg|N|%|°|º|cm|reps?))?/g; let m; while((m = re.exec(s))){ out += esc(s.slice(last, m.index)) + '<mark>' + esc(m[0]) + '</mark>'; last = re.lastIndex; } return out + esc(s.slice(last)); };
  return (r.blocos || []).map((b, i) => {
    if(b.tipo === 'p'){
      const tit = b.texto.replace(/^\d+(?:\.\d+)*[.)]?\s+/, '').replace(/:$/, '');
      if(secs.has(tit) && b.texto.length <= 80) return `<h4>${esc(b.texto)}</h4>`;
      return `<p${us.has(i) ? ' class="usada"' : ''}>${realca(b.texto)}</p>`;
    }
    return `<table${us.has(i) ? ' class="usada"' : ''}>` + b.linhas.map(r2 => '<tr>' + r2.map(c => `<td>${realca(c)}</td>`).join('') + '</tr>').join('') + '</table>';
  }).join('') || '<p class="r-muted">Documento sem texto.</p>';
}
function renderImport(){
  let bg = document.getElementById('impbg');
  if(!IMPATUAL){ if(bg) bg.remove(); return; }
  if(!bg){ bg = document.createElement('div'); bg.id = 'impbg'; bg.className = 'imp-bg'; document.body.appendChild(bg); ligarImport(bg); }
  const it = IMPATUAL, r = it.r, vazio = !S.avaliacoes.some(temDados);
  const opts = [];
  if(it.revisao) S.avaliacoes.forEach((a, i) => opts.push(['av:' + i, 'Corrigir ' + (i === 0 ? 'a avaliação inicial' : 'a reavaliação ' + i) + (a.data ? ' (' + dataPT(a.data) + ')' : '')]));
  else if(vazio) opts.push(['inicial', 'Avaliação inicial de um utente novo']);
  else { opts.push(['nova', 'Nova avaliação deste utente']); S.avaliacoes.forEach((a, i) => opts.push(['av:' + i, 'Completar ' + (i === 0 ? 'a avaliação inicial' : 'a reavaliação ' + i) + (a.data ? ' (' + dataPT(a.data) + ')' : '')])); }
  const dSug = (r.sug.find(s => s.campo === 'av.data') || {}).valor;
  const mesma = !it.revisao && !vazio && dSug ? S.avaliacoes.findIndex(a => a.data === dSug) : -1;
  const alvoSel = it.revisao && it.ai != null ? 'av:' + it.ai : (mesma >= 0 ? 'av:' + mesma : opts[0][0]);
  let h = `<div class="imp" role="dialog" aria-modal="true" aria-label="Importar ficha">`;
  h += `<div class="imp-h"><div style="min-width:0"><div style="font-weight:600;color:var(--navy);font-size:15px">${it.revisao ? 'Rever importação' : 'Importar ficha'}${r.activforce ? ' · relatório ActivForce' : ''}</div><div class="r-muted" style="overflow-wrap:anywhere">${esc(it.nome)}${IMPQ.length ? ` · faltam ${IMPQ.length} ficheiro(s)` : ''}</div></div>`;
  h += `<div style="display:flex;gap:8px;align-items:center"><label class="r-muted" for="impAlvo">Aplicar em</label><select id="impAlvo">${opts.map(([v, t]) => `<option value="${v}"${v === alvoSel ? ' selected' : ''}>${esc(t)}</option>`).join('')}</select></div></div>`;
  h += `<div class="imp-b"><div class="imp-l">`;
  if(mesma >= 0) h += `<p class="hint" style="color:var(--teal-text)">Já existe uma avaliação com a mesma data: por defeito, este ficheiro completa essa avaliação.</p>`;
  if(r.info && r.info.length) h += `<h4 class="imp-g">Avisos</h4>` + r.info.map(t => `<p class="hint">${esc(t)}</p>`).join('');
  if(!r.sug.length) h += `<p class="empty">Não reconheci valores neste documento. Copie-os do texto à direita para o painel de dados.</p>`;
  const grupos = [['id', 'Identificação e episódio'], ['forca', 'Força (kgf; cada valor separado por / é uma tentativa)'], ['prom', 'Questionários'], ['texto', 'O seu texto para a página 2 (desmarcado: marque se quiser trazê-lo)']];
  for(const [t, tit] of grupos){
    const lst = r.sug.map((s, i) => [s, i]).filter(([s]) => s.tipo === t);
    if(!lst.length) continue;
    h += `<h4 class="imp-g">${tit}</h4>`;
    for(const [s, i] of lst){
      let ctl;
      if(s.tipo === 'texto') ctl = `<textarea data-imp="${i}" rows="5" aria-label="${esc(s.rotulo)}">${esc(s.valor)}</textarea>`;
      else if(s.campo === 'meta.perfil') ctl = `<select data-imp="${i}" aria-label="Perfil">${Object.entries(PERFIS_JO).map(([k, p]) => `<option value="${k}"${k === s.valor ? ' selected' : ''}>${esc(p.nome)}</option>`).join('')}</select>`;
      else if(s.campo === 'meta.lado') ctl = `<select data-imp="${i}" aria-label="Lado">${[['E','Esquerdo'],['D','Direito']].concat(ativo('jo') ? [['N','Sem lado afetado']] : []).map(([k, n]) => `<option value="${k}"${k === s.valor ? ' selected' : ''}>${n}</option>`).join('')}</select>`;
      else if(s.campo === 'av.angulo') ctl = `<select data-imp="${i}" aria-label="Ângulo">${[['60','60°'],['90','90°']].map(([k, n]) => `<option value="${k}"${k === s.valor ? ' selected' : ''}>${n}</option>`).join('')}</select>`;
      else ctl = `<input data-imp="${i}" value="${esc(s.valor)}"${/data|dataRef/.test(s.campo) ? ' type="date"' : ''} aria-label="${esc(s.rotulo)}">`;
      h += `<div class="sg"><input type="checkbox" data-impc="${i}"${s.marcado ? ' checked' : ''} aria-label="Importar ${esc(s.rotulo)}"><span class="sg-l">${esc(s.rotulo)}</span>${ctl}<span class="src">${esc(String(s.origem || '').slice(0, 180))}</span>${s.aviso ? `<span class="av">${esc(s.aviso)}</span>` : ''}</div>`;
    }
  }
  h += `</div><div class="imp-r" aria-label="Texto da ficha original">${textoDoc(r)}</div></div>`;
  h += `<div class="imp-f"><span class="r-muted" style="margin-right:auto">Os valores marcados entram na avaliação escolhida. Os dados não saem deste computador.</span>`;
  h += `<button class="btn" type="button" data-impact="${IMPQ.length ? 'saltar' : 'fechar'}">${IMPQ.length ? 'Saltar este ficheiro' : (it.revisao ? 'Fechar' : 'Cancelar')}</button><button class="btn primary" type="button" data-impact="aplicar">${it.revisao ? 'Aplicar correções' : 'Aplicar selecionados'}</button></div></div>`;
  bg.innerHTML = h;
  const f = bg.querySelector('[data-impact="aplicar"]'); if(f) f.focus();
}
function ligarImport(bg){
  const upd = el => { if(el.dataset.impc != null) IMPATUAL.r.sug[+el.dataset.impc].marcado = el.checked; if(el.dataset.imp != null) IMPATUAL.r.sug[+el.dataset.imp].valor = el.value; };
  bg.addEventListener('input', ev => upd(ev.target));
  bg.addEventListener('change', ev => upd(ev.target));
  bg.addEventListener('click', ev => {
    const b = ev.target.closest('[data-impact]'); if(!b) return;
    if(b.dataset.impact === 'aplicar'){ const alvo = document.getElementById('impAlvo').value; aplicarImport(IMPATUAL.r, alvo, IMPATUAL.nome); buildEditor(); render(); proximoImport(); }
    else if(b.dataset.impact === 'saltar') proximoImport();
    else { IMPQ = []; IMPATUAL = null; renderImport(); }
  });
  bg.addEventListener('keydown', ev => { if(ev.key === 'Escape'){ IMPQ = []; IMPATUAL = null; renderImport(); } });
}
function aplicarImport(r, alvo, nome){
  const novo = !S.avaliacoes.some(temDados), rp = regAtivas()[0];
  let ai;
  if(alvo === 'inicial') ai = 0;
  else if(alvo === 'nova'){ S.avaliacoes.push(novaAvaliacao(S.avaliacoes[S.avaliacoes.length - 1])); ai = S.avaliacoes.length - 1; S.avaliacoes[ai].angulo = ''; S.avaliacoes[ai].bracoJo = ''; S.avaliacoes[ai].braco = ''; }
  else ai = +String(alvo).split(':')[1] || 0;
  if(novo && !(S.importado && S.importado.length)){
    for(const reg of regAtivas()) S.protocolo[reg] = {...S.protocolo[reg], dispositivo:'', fixacao:'', posicao:'', duracao:'', repouso:'', tentativas:'1'};
    S.avaliacoes[0].angulo = ''; S.avaliacoes[0].bracoJo = ''; S.avaliacoes[0].braco = '';
  }
  const a = S.avaliacoes[ai];
  for(const s of r.sug){
    if(!s.marcado || s.tipo === 'info') continue;
    const v = s.valor;
    if(s.campo === 'av.data') a.data = v;
    else if(s.campo === 'av.massa') a.massa = v;
    else if(s.campo === 'av.angulo') a.angulo = v;
    else if(s.campo === 'meta.perfil'){ S.meta.jo.perfil = v; if(novo){ S.meta.jo.anca = perfilJo().anca; S.meta.jo.tipoRef = perfilJo().tipoRef; } }
    else if(s.campo === 'meta.lado') S.meta[rp].lado = v;
    else if(s.campo === 'meta.dataRef'){ S.meta[rp].dataRef = v; if(s.tipoRef && rp !== 'tz') S.meta[rp].tipoRef = s.tipoRef; }
    else if(s.campo.startsWith('media.')){ const [, g, l] = s.campo.split('.'); a.media = a.media || {}; a.media[g] = a.media[g] || {}; a.media[g][l] = String(v).split('/').map(x => x.trim()).filter(Boolean).slice(0, 6); }
    else if(s.campo.startsWith('forca.')){ const [, g, l] = s.campo.split('.'); a.forca[g] = a.forca[g] || {}; a.forca[g][l] = String(v).split('/').map(x => x.trim()).filter(Boolean).slice(0, 6); if(FG[g] && FG[g].anca) S.meta.jo.anca = 'sim'; if(FG[g] && FG[g].rot) S.meta.an.rot = 'sim'; }
    else if(s.campo.startsWith('prom.')) a.proms[s.campo.slice(5)] = v;
    else if(s.campo.startsWith('plano.')) setPath(S, s.campo, v);
  }
  if(r.activforce) for(const reg of regAtivas()) if(!S.protocolo[reg].dispositivo) S.protocolo[reg].dispositivo = 'ActivForce';
  for(const reg of regAtivas()){
    const maxT = Math.max(1, ...S.avaliacoes.flatMap(x => GR(reg).map(g => (x.forca || {})[g]).filter(Boolean).flatMap(f => [(f.E || []).length, (f.D || []).length])));
    if(maxT > nT(reg)) S.protocolo[reg].tentativas = String(Math.min(6, maxT));
  }
  S.exemplo = false;
  S.importado = (S.importado || []).filter(x => x.ficheiro !== nome).concat([{ficheiro: nome, em: new Date().toISOString().slice(0, 10)}]);
  S.revisto = false;
  const atual = a;
  const com = S.avaliacoes.filter(x => x.data).sort((x, y) => x.data < y.data ? -1 : x.data > y.data ? 1 : 0);
  S.avaliacoes = com.concat(S.avaliacoes.filter(x => !x.data));
  tab = Math.max(0, S.avaliacoes.indexOf(atual));
  IMPULT = {nome, r, revisao: true, ai: tab};
  dirty = true;
}
/* ===================== Arranque ===================== */
const EMB = document.getElementById('dados-utente'), EMBI = document.getElementById('importacao');
if(EMB && EMB.textContent.trim()){
  try{ S = carregar(JSON.parse(EMB.textContent)); tab = S.avaliacoes.length - 1; }catch(e){ console.error(e); }
} else if(EMBI && EMBI.textContent.trim()){
  try{
    let lst = JSON.parse(EMBI.textContent); if(!Array.isArray(lst)) lst = [lst];
    S = novoEstado();
    lst.forEach((o, k) => {
      const r = ajustarRegioes(o.r); let alvo = 'inicial';
      if(k > 0){ const d = (r.sug.find(s => s.campo === 'av.data') || {}).valor; const i = d ? S.avaliacoes.findIndex(a => a.data === d) : -1; alvo = i >= 0 ? 'av:' + i : 'nova'; }
      aplicarImport(r, alvo, o.ficheiro);
    });
    dirty = false;
  }catch(e){ console.error(e); }
} else if(location.hash === '#exemplo'){ S = exemplo(); tab = S.avaliacoes.length - 1; }
buildEditor();
render();
if(document.fonts && document.fonts.ready) document.fonts.ready.then(render);

</script>
